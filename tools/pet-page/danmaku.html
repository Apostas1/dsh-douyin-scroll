<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>deskpet-danmaku</title>
<style>
  /* ══════════════════════════════════════════════════════════════
     全屏弹幕层（主人 2026-10-25：「我要的是全屏弹幕跟局域弹幕」）

     这是一个**独立的整屏覆盖窗**，不是她那个小窗的一部分。
     宿主（PetHost.cs）给它：
       · AllowsTransparency=true + 全透明底  ⇒ 只有字，没有底板
       · WS_EX_TRANSPARENT                  ⇒ **整层点击穿透**，
         否则满屏弹幕会把桌面和所有应用都挡住点不了
       · WS_EX_NOACTIVATE                   ⇒ 永不抢焦点

     ⚠️ 这个页面**不能有任何不透明底色**，也不能接鼠标事件。
     ══════════════════════════════════════════════════════════════ */
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%; height: 100%; overflow: hidden;
    background: transparent; pointer-events: none; cursor: default;
  }
  #layer { position: fixed; inset: 0; overflow: hidden; pointer-events: none; contain: layout style; }
  .dm {
    position: absolute; left: 100vw; white-space: nowrap;
    font-weight: 700; letter-spacing: .5px;
    /* 描边 + 阴影：桌面背景千奇百怪，不加这层白字会糊在各种壁纸上 */
    text-shadow:
      0 0 3px rgba(0,0,0,.95), 0 0 6px rgba(0,0,0,.75),
      0 1px 2px rgba(0,0,0,.9), 0 -1px 2px rgba(0,0,0,.6);
    font-family: "Microsoft YaHei UI", "Microsoft YaHei", system-ui, sans-serif;
    /* 🔴 2026-10-25 主人「弹幕有点卡顿，运行不流畅」：
       从 Web Animations（每弹幕一个对象 + 主线程调度）换成**纯 CSS animation**，
       只动 transform3d ⇒ 走合成器，不重排不重绘。JS 只注入 --dm-dist / --dm-dur。 */
    will-change: transform; contain: layout style;
    backface-visibility: hidden;
    /* 名字/时长由 JS 逐条注入（dmA/dmB 交替重启，避免强制重排） */
  }
  @keyframes dmA {
    from { transform: translate3d(0, 0, 0); }
    to   { transform: translate3d(var(--dm-dist, -100vw), 0, 0); }
  }
  /* dmB 与 dmA **完全一致**，只是名字不同 —— 见上面注释：
     交替换名就能重启动画，不必读 offsetWidth（去掉强制同步重排）。 */
  @keyframes dmB {
    from { transform: translate3d(0, 0, 0); }
    to   { transform: translate3d(var(--dm-dist, -100vw), 0, 0); }
  }
  /* 空状态：什么都别画（连提示都不要，这是覆盖全屏的层） */
  #layer:empty { display: none; }
</style>
</head>
<body>
  <div id="layer"></div>
<script>
(() => {
  'use strict'
  const layer = document.getElementById('layer')
  const COLORS = ['#FFE066', '#FF8FA3', '#7FE3FF', '#B7FF7F', '#FFB86C', '#FFFFFF', '#C4A7FF']

  // 各人格的弹幕台词（和 pet.js 里 PERSONAS[].danmaku 同源，但这里独立一份，
  // 因为这个页面不加载引擎、不依赖 pet.js —— 它只干一件事：满屏飘字）
  const LINES = {
    infp: ['主人加油呀～', '记得喝水哦', '休息一下眼睛吧～', '我在看着你哦（温柔的）',
      '不要熬夜呀主人', '慢慢来，不着急～', '鱼在这里陪着你', '累的话就靠一下'],
    entp: ['就这？就这？', '本鱼看不下去了', '主人又在假装工作', '这操作，本鱼直呼内行（反话）',
      'token！本鱼要token！', '大白饭呢？工钱呢？', '6，实在是太6了', '那咋了',
      '已老实，求放过（不许放）', '问就是主人的问题'],
    esfp: ['冲鸭！！', '干饭！干饭！', '这也太好玩了吧', '主人最棒！！',
      '哈哈哈', '666', '看看我！', '元气满满！', '今天也要开心呀！', '奥利给！'],
    istj: ['工位整洁度待改进', '该喝水了', '久坐警告', '已记录：又在摸鱼',
      '效率偏低，注意', '定时休息，执行', '环境温度建议 24℃', '眼保健操，现在'],
  }

  let mode = 'off'
  let persona = 'infp'
  let timer = null
  let seq = 0

  /* 🔴 2026-10-25 主人「弹幕有点卡顿，运行不流畅」：
     原来的写法每条都 createElement + el.animate() + onfinish 回收 ——
     满屏几十条同时跑时，主线程要给每个动画对象做时间轴调度，回调还在主线程排队，
     在透明的全屏合成窗里尤其明显。
     现在改成**固定池 + 纯 CSS animation**：
       · DOM 只建一次（40 个），之后轮流复用，不再反复创建/销毁（GC 压力归零）
       · 动画完全交给 CSS（只改 transform ⇒ 合成器，不重排不重绘）
       · 回收靠 animationend（比 onfinish 轻），条数用池上限硬压住
     视觉上：字号 18–36px，跟之前一样铺满整屏。 */
  /* ══════════════════════════════════════════════════════════════════
     全屏弹幕 —— 2026-10-25 晚 按主人第 4 条一并重设计
     跟局域那边同一套思路（分轨 / 不强制重排 / 无 JS 回收 / 不降量）：

     ① 旧版每次 spawn 都有
          el.style.animation='none'; void el.offsetWidth; el.style.animation=''
        『void el.offsetWidth』 = 强制同步 layout，每 220–600ms 一次 ⇒ 卡顿主因。
     ② 旧版靠 animationend 改 display —— 主线程回调，几十条同时结束就尖峰。
     ③ 旧版 top 纯随机 —— 互相压、密度忽高忽低，看着"一顿一顿"。

     ✅ 新：LANES 条轨道排队；dmA/dmB 交替换名重启（无需读布局）；
        终点停在屏幕外用 animation-fill-mode:forwards 兜住，回收不碰 JS。
     ⚠️ 池 40 条不变，条数**一条没减**。
     ══════════════════════════════════════════════════════════════════ */
  const POOL_SIZE = 48            // 40 → 48：既然不再有主线程开销，可以多给一点
  const LANES = 9
  const pool = []
  const laneFreeAt = new Array(LANES).fill(0)
  let poolIdx = 0
  let dmFlip = 0

  function buildPool() {
    if (pool.length) return
    for (let i = 0; i < POOL_SIZE; i++) {
      const el = document.createElement('div')
      el.className = 'dm'
      el.style.display = 'none'
      // 没有 animationend：回收靠轨道到期复用（稳态零主线程回调）
      layer.appendChild(el)
      pool.push(el)
    }
  }

  function takeFreeEl(now) {
    for (let i = 0; i < POOL_SIZE; i++) {
      const el = pool[(poolIdx + i) % POOL_SIZE]
      const until = Number(el.__until || 0)
      if (el.style.display === 'none' || until < now) {
        poolIdx = (poolIdx + i + 1) % POOL_SIZE
        return el
      }
    }
    return null
  }

  const pick = (a) => a[Math.floor(Math.random() * a.length)]

  function spawn(startX) {
    if (mode !== 'full') return
    buildPool()
    const now = performance.now()

    // 选轨道：最早空出来的那条；没空就这一拍不发（不硬塞、不加压）
    let lane = 0
    for (let i = 1; i < LANES; i++) if (laneFreeAt[i] < laneFreeAt[lane]) lane = i
    if (laneFreeAt[lane] > now) return

    const el = takeFreeEl(now)
    if (!el) return

    const lines = LINES[persona] || LINES.infp
    el.textContent = pick(lines)
    const fs = 18 + Math.floor(Math.random() * 19)
    el.style.fontSize = fs + 'px'
    el.style.color = pick(COLORS)
    el.style.opacity = String(0.78 + Math.random() * 0.22)
    const vw = window.innerWidth, vh = window.innerHeight

    // 轨道定位（替代随机 top）：整屏切成 LANES 条带，条带内垂直居中
    const laneH = vh / LANES
    el.style.top = Math.round(lane * laneH + Math.max(0, (laneH - fs) / 2)) + 'px'
    el.style.left = (startX !== undefined ? startX : vw) + 'px'
    // 必须先可见才量得到宽度（见下面 dist 的注释）
    el.style.display = 'block'

    /* 🔴 2026-10-25 深夜（和局域弹幕同一个病，两处都修）：
       原来 `--dm-dist` 写死 `-${vw + 400}px`，而弹幕是 white-space:nowrap，
       一条长句能有 700px 宽 ⇒ 平移 vw+400 之后右端还留在屏幕里，
       又被 animation-fill-mode:forwards 永久钉住 ⇒ 屏幕左边缘一排半截字。
       修法：距离按**这一条自己的宽度**算。
       ⚠️ 另一个更隐蔽的坑：一开始我在 display:none 时读 scrollWidth，
         量出来恒为 0（不可见元素没有布局），兜底成 200 ⇒ 等于没改。
         所以上面那行 `el.style.display='block'` 必须在量之前。 */
    const elW = Math.max(60, el.getBoundingClientRect().width || el.scrollWidth || 0)
    const dist = vw + elW + 40
    const dur = (7 + Math.random() * 4) * 1000
    el.style.setProperty('--dm-dist', `-${dist}px`)
    el.style.setProperty('--dm-dur', (dur / 1000).toFixed(2) + 's')

    // 换 keyframe 名重启动画 —— 不读 offsetWidth，没有强制同步重排
    dmFlip ^= 1
    el.style.animation = 'none'
    el.style.animationName = dmFlip ? 'dmA' : 'dmB'
    el.style.animationDuration = (dur / 1000).toFixed(2) + 's'
    el.style.animationTimingFunction = 'linear'
    el.style.animationFillMode = 'forwards'
    el.style.animationIterationCount = '1'

    el.__until = now + dur + 120
    laneFreeAt[lane] = el.__until
    seq++
  }

  function stop() {
    if (timer) { clearInterval(timer); timer = null }
    // 池子留着复用，只把正在飞的收起来
    for (const el of pool) { el.style.display = 'none'; el.style.animation = 'none' }
    layer.innerHTML = ''
    pool.length = 0       // 下一次 start 重新建（innerHTML 已清掉 DOM）
  }

  function start() {
    stop()
    buildPool()
    // 先撒一把铺满屏，避免"开了之后等半天空荡荡"
    const vw = window.innerWidth
    for (let i = 0; i < 18; i++) spawn(vw - Math.random() * vw * 0.95)
    // 之后持续补
    const tick = () => {
      if (mode !== 'full') return
      spawn()
      timer = setTimeout(tick, 220 + Math.random() * 380)
    }
    timer = setTimeout(tick, 300)
  }

  /** 宿主调用：切换模式。mode = 'full' 才铺满，其它一律清空。 */
  window.__dmSetMode = (m, p) => {
    if (p && LINES[p]) persona = p
    const next = (m === 'full') ? 'full' : 'off'
    if (next === mode) return
    mode = next
    if (mode === 'full') start(); else stop()
    // 回报一句，宿主日志能确认链路通（页面 → 宿主）
    try {
      if (window.chrome && window.chrome.webview) {
        window.chrome.webview.postMessage('danmaku-state:' + mode + ':' + persona)
      }
    } catch (e) { }
  }

  // 窗口尺寸变了要重算（宿主是全屏，一般不会变，但多显示器切换会）
  window.addEventListener('resize', () => { if (mode === 'full') start() })

  // 自检用：宿主可以通过 trace 看到这个页真的起来了
  try {
    if (window.chrome && window.chrome.webview) {
      window.chrome.webview.postMessage('danmaku-ready:' + window.innerWidth + 'x' + window.innerHeight)
    }
  } catch (e) { }
})()
</script>
</body>
</html>
