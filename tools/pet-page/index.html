<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>deskpet-page</title>
<link rel="stylesheet" href="pet.css">
</head>
<body>
  <!-- 引擎画布（WebGL，透明背景） -->
  <canvas id="gl"></canvas>

  <!-- 弹幕层 -->
  <div id="danmaku"></div>

  <!-- 她本体容器（负责拖动/定位/泡泡；渲染在 canvas 里） -->
  <div id="pet">
    <div id="pet-bubble"></div>
    <div id="pet-body" title=""></div>
  </div>

  <!-- ⭐ 底部停靠区（主人 2026-10-25 三条要求一起满足）
       「1.文本输入框要放在宠物状态栏下面要可以隐藏状态栏」
       「3输入框移动到4最低排按钮下面，4最低排按钮要可以隐藏」

       顺序（从上到下）= 她 → 按钮条 → 输入框。
       ⇒ 用**一个 column flex、贴窗口底**的容器装这两块：
          · 底边永远钉在窗口底（bottom:5px）⇒ 输入框**位置永远不动**，
            长高只往上长，绝不会"点一下弹上去"（那是上一版的病）；
          · 按钮条在 DOM 里排在输入框**前面** ⇒ 天然落在它上方；
          · 输入框长高时容器变高，按钮条跟着往上让 —— 这是"输入框在按钮下面"
            的必然结果，而且动的是按钮条、不是输入框。
       ⇒ 按钮条可隐藏：#dock.tool-off 里 display:none（右键菜单 / 配置 petToolbar）。 -->
  <div id="dock">
    <!-- 🔴 底部按钮条（WebView2 宿主里右键菜单不一定弹得出来，这里给固定入口）
         🔴 2026-10-25 主人：「下方的菜单栏有点挡脚了」
         真因：按钮条原来钉在窗口最底（bottom:6px），而她的脚就在画布最底 ⇒ 必然压脚。
         现在它和输入框一起住进 #dock，#dock 贴在为它们预留的那条缝里（--foot-gap），
         做成很小的一条（21px 高、默认 30% 透明），不显眼、不压脚。 -->
    <div id="toolbar">
      <button class="tb" data-act="chat" title="跟她聊天">💬</button>
      <button class="tb" data-act="feed" title="喂饭">🍚</button>
      <button class="tb" data-act="play" title="逗她">🎬</button>
      <button class="tb" data-act="danmaku" title="弹幕（局域→全屏→关）">📺</button>
      <button class="tb" data-act="chat-danmaku" title="弹幕聊天模式（她回你用弹幕滚）">💬📺</button>
      <button class="tb" data-act="voice" title="语音：开/关（她出声，嘴型跟着对）">🔊</button>
      <button class="tb" data-act="toolbar-toggle" title="隐藏这条按钮（右键菜单可叫回来）">⌄</button>
      <button class="tb" data-act="hide" title="去休息">😪</button>
      <button class="tb tb-danger" data-act="quit" title="退出">🚪</button>
    </div>

    <!-- 对话输入区（固定位置，点它不会往上弹）
         🔴🔴🔴 2026-10-25 晚 主人：「宠物下面的对话框要固定位置不要因为点击对话框就自动弹上去了，
           该变的是文本输出框，应该弹在下面」
         ⇒ 输入框贴在 #dock 的**底边**，高度变化只在它自己身上；
           她的回话走**上方气泡**（文本输出框），那才是该变的东西。
         ⇒ 加了 #talk-wrap 外壳：旧版是裸 textarea，所以主人说"太丑"。 -->
    <div id="talkbar">
      <div id="talk-wrap">
        <textarea id="chat-input" rows="1" placeholder="跟她说句话…（Enter 发送 / Shift+Enter 换行）"></textarea>
        <button id="chat-send" title="发送（Enter）">➤</button>
      </div>
    </div>
  </div>

  <!-- 右键菜单（浏览器预览时用；WebView2 宿主里走原生 WPF 菜单，这个是兜底） -->
  <div id="menu">
    <div class="mi" data-act="chat">💬 跟她聊天</div>
    <div class="mi" data-act="feed">🍚 喂饭（大白饭）</div>
    <div class="mi" data-act="repair">🔧 维修工模式</div>
    <div class="sep"></div>
    <div class="mi" data-act="play">🎬 逗她（随机小动作）</div>
    <div class="mi" data-act="danmaku-full">📺 全屏弹幕（铺满整屏）</div>
    <div class="mi" data-act="danmaku-local">📺 局域弹幕（她身边）</div>
    <div class="mi" data-act="danmaku-off">📴 关掉弹幕</div>
    <div class="sep"></div>
    <div class="mi" data-act="voice">🔊 语音：开/关（她出声，嘴型跟上）</div>
    <div class="mi" data-act="toolbar-toggle">⌄ 显示/隐藏底部按钮条</div>
    <div class="sep"></div>
    <div class="mi" data-act="persona-infp">🎭 人格：INFP 治愈小鱼</div>
    <div class="mi" data-act="persona-entp">🎭 人格：ENTP 毒舌本鱼</div>
    <div class="mi" data-act="persona-esfp">🎭 人格：ESFP 元气小鱼</div>
    <div class="mi" data-act="persona-istj">🎭 人格：ISTJ 维修工小鱼</div>
    <div class="sep"></div>
    <div class="mi" data-act="hide">😪 去休息（面板可叫回）</div>
    <div class="mi" data-act="quit">🚪 退出（关掉她）</div>
  </div>

  <!-- 引擎库（Anime2.5DRig，MIT）+ 本页逻辑 -->
  <script src="engine/ag-psd.min.js"></script>
  <script src="engine/rigger.js"></script>
  <script src="engine/renderer.js"></script>
  <script src="engine/runtime.js"></script>
  <script src="engine/genericparts.js"></script>
  <script src="pet.js"></script>
</body>
</html>
